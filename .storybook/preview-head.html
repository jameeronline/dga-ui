<style>
  /* Example: Customizing the syntax highlighting colors */
  .sbdocs .prismjs .token.comment,
  .sbdocs .prismjs .token.prolog,
  .sbdocs .prismjs .token.doctype,
  .sbdocs .prismjs .token.cdata {
    color: #6a737d; /* A softer gray for comments */
    font-style: italic;
  }

  .sbdocs .prismjs .token.function {
    color: #6f42c1; /* Purple for functions */
  }

  .sbdocs .prismjs .token.keyword {
    color: #d73a49; /* Red for keywords */
  }

  .sbdocs .prismjs .token.string {
    color: #032f62; /* Dark blue for strings */
  }

  /* Example: Changing the background and border of the code block */
  .sbdocs pre.prismjs {
    /* background-color: #f6f8fa !important;
    border: 1px solid #e1e4e8;
    border-radius: 6px; */
    font-size: 14px !important;
  }
</style>
